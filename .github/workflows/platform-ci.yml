name: Platform CI

on:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: API + pipeline (lint, tests, end-to-end on DuckDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vt
          POSTGRES_PASSWORD: vt
          POSTGRES_DB: vt_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U vt -d vt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vt:vt@localhost:5433/vt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/api/pyproject.toml
            platform/pipeline/pyproject.toml
      - run: python -m pip install -e "platform/api[dev]" -e "platform/pipeline[dev]"
      - name: Lint and format check
        run: |
          ruff check platform/api platform/pipeline
          ruff format --check platform/api platform/pipeline
      - name: API tests
        working-directory: platform/api
        run: pytest -q
      - name: Pipeline tests
        working-directory: platform/pipeline
        run: pytest -q

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/infra/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: platform/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pipeline image
        uses: docker/build-push-action@v6
        with:
          context: platform/pipeline
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/web/Dockerfile
          push: false
          build-args: |
            VITE_BASE=/
          cache-from: type=gha
          cache-to: type=gha,mode=max
