# Deploys the web app to Cloud Run and refreshes the pipeline job image.
#
# Nothing here runs until the repository variables from `terraform output
# github_actions_variables` are set (GCP_PROJECT_ID gates the whole workflow), plus
# VITE_API_URL = the public URL of the sync API on your server. Authentication is
# Workload Identity Federation: no service-account keys in GitHub.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: cloud-run
      url: ${{ steps.web.outputs.url }}
    env:
      REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/web:${{ env.TAG }}
            ${{ env.REGISTRY }}/web:latest
          build-args: |
            VITE_BASE=/
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push pipeline image
        uses: docker/build-push-action@v6
        with:
          context: platform/pipeline
          push: true
          tags: |
            ${{ env.REGISTRY }}/pipeline:${{ env.TAG }}
            ${{ env.REGISTRY }}/pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: web
        name: Deploy web service
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_WEB_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${REGISTRY}/web:${TAG}" \
            --service-account "${{ vars.WEB_SERVICE_ACCOUNT }}" \
            --port 8080 \
            --allow-unauthenticated \
            --quiet
          echo "url=$(gcloud run services describe "${{ vars.CLOUD_RUN_WEB_SERVICE }}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Update pipeline job image
        if: vars.CLOUD_RUN_PIPELINE_JOB != ''
        run: |
          gcloud run jobs update "${{ vars.CLOUD_RUN_PIPELINE_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${REGISTRY}/pipeline:${TAG}" \
            --quiet
