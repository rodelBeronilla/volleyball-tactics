[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-pipeline"
version = "0.1.0"
description = "Volleyball Tactics data pipeline: Postgres → Parquet lake → warehouse (DuckDB locally, BigQuery on GCP), with SQL models, quality checks and reconciliation."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pytz>=2024.1",
    "sqlglot>=25",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
gcp = ["google-cloud-bigquery>=3.25", "google-cloud-storage>=2.18"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vt-pipeline = "vt_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["vt_pipeline*"]

[tool.setuptools.package-data]
vt_pipeline = ["sql/*/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
