# The on-premises half of the platform: run this on your own server.
#
#   cp .env.example .env            # then fill in POSTGRES_PASSWORD, SYNC_TOKEN, SITE_DOMAIN
#   docker compose up -d --build    # postgres + api + web + pipeline (ports on 127.0.0.1 only)
#
# Publishing it on a domain, pick one:
#   * The server already runs a reverse proxy (e.g. the plex-stack Caddy): add
#     compose.shared-proxy.yaml, which joins api + web to that proxy's network as
#     vt-api / vt-web, and paste edge/existing-caddy.caddy into its Caddyfile.
#     Setting COMPOSE_FILE in .env makes plain `docker compose` include it.
#   * Nothing else listens on 80/443: `docker compose --profile edge up -d` starts
#     this project's own Caddy with automatic HTTPS for SITE_DOMAIN.
#
#   docker compose --profile bi up -d     # + Metabase for self-hosted dashboards
#
# The pipeline runs with PIPELINE_TARGET=local (DuckDB in the `lake` volume) until you
# point it at GCP: set PIPELINE_TARGET=gcp, GCP_PROJECT, GCS_BUCKET and drop the
# service-account key at ./secrets/gcp-sa.json (see docs/platform/deploy-gcp.md).
name: volleyball-tactics

x-database-url: &database-url postgresql://${POSTGRES_USER:-vt}:${POSTGRES_PASSWORD}@vt-postgres:5432/${POSTGRES_DB:-vt}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        # A unique name: other stacks on a shared proxy network may have their own "postgres".
        aliases: [vt-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vt} -d ${POSTGRES_DB:-vt}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  api:
    build: ./api
    image: vt-api:local
    environment:
      DATABASE_URL: *database-url
      SYNC_TOKEN: ${SYNC_TOKEN:?set SYNC_TOKEN in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAX_PAYLOAD_MB: ${MAX_PAYLOAD_MB:-25}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The web app, built for the site root with the API at <site>/api (same origin, no CORS needed).
  web:
    build:
      context: ..
      dockerfile: platform/web/Dockerfile
      args:
        VITE_BASE: /
        VITE_API_URL: ${PUBLIC_API_URL:-https://${SITE_DOMAIN:-localhost}/api}
    image: vt-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    restart: unless-stopped

  pipeline:
    build: ./pipeline
    image: vt-pipeline:local
    command: ["schedule", "--every", "${PIPELINE_INTERVAL_SECONDS:-900}"]
    environment:
      DATABASE_URL: *database-url
      PIPELINE_TARGET: ${PIPELINE_TARGET:-local}
      LAKE_DIR: /lake
      SCORESHEETS_DIR: /scoresheets
      GCP_PROJECT: ${GCP_PROJECT:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      BQ_LOCATION: ${BQ_LOCATION:-northamerica-northeast2}
      FRESHNESS_HOURS: ${FRESHNESS_HOURS:-48}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      - lake:/lake
      - ./scoresheets:/scoresheets:ro
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: this project's own HTTPS front door (only when nothing else owns 80/443).
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN (e.g. volleyballtactics.example.com) in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

  # Optional: self-hosted dashboards. Connect it to Postgres (operational) and/or BigQuery (marts).
  metabase:
    profiles: ["bi"]
    image: metabase/metabase:latest
    ports:
      - "127.0.0.1:${METABASE_PORT:-3001}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped

volumes:
  pgdata:
  lake:
  caddy_data:
  caddy_config:
  metabase_data:
